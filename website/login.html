<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to SCALEGPT</title>
<meta name="description" content="Sign in to SCALEGPT with your Google account or your work email.">
<!-- Address of the running SCALEGPT app (LibreChat), e.g. https://app.scalegpt.example.com. Leave empty until the app is deployed. -->
<meta name="scalegpt-app-url" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6B5E'/%3E%3Cpath d='M9 21c2 2 5 2.5 7.5 2 3-.6 5-2.6 5-5.2 0-5.6-11-3.6-11-8.6C10.5 7 12.7 5.6 15.5 5.6c2 0 3.8.7 5 1.9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF1EE; --paper-2: #E3E8E4; --surface: #FFFFFF; --ink: #17212B; --ink-2: #4A5663;
  --line: #CBD3CE; --teal: #0F6B5E; --teal-ink: #FFFFFF; --teal-soft: #D5E8E3; --warn: #A86200;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121A20; --paper-2: #18222A; --surface: #1C2730; --ink: #E6ECE8; --ink-2: #A5B1AC;
    --line: #2E3C45; --teal: #3FB3A0; --teal-ink: #0B1A17; --teal-soft: #173A35; --warn: #E3A548;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121A20; --paper-2: #18222A; --surface: #1C2730; --ink: #E6ECE8; --ink-2: #A5B1AC;
  --line: #2E3C45; --teal: #3FB3A0; --teal-ink: #0B1A17; --teal-soft: #173A35; --warn: #E3A548;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
  background: var(--paper); color: var(--ink); font: 400 1rem/1.55 "IBM Plex Sans", system-ui, sans-serif;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 6px; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
.top { display: flex; align-items: center; justify-content: space-between; padding-block: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 1.25rem/1 "Bricolage Grotesque", sans-serif; text-decoration: none; letter-spacing: -0.02em; }
.brand svg { width: 30px; height: 30px; }
.back { font-size: .95rem; color: var(--ink-2); text-decoration: none; }
.back:hover { color: var(--ink); }

main { display: grid; place-items: center; padding: 24px 16px 64px; }
.card {
  width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 36px 32px 28px; box-shadow: 0 30px 60px -34px rgba(15, 50, 45, .35);
}
h1 { margin: 0; font: 800 2rem/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; }
.sub { margin: 10px 0 28px; color: var(--ink-2); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
  padding: 13px 18px; border-radius: 999px; font: 600 1rem/1.2 "IBM Plex Sans", sans-serif;
  text-decoration: none; cursor: pointer;
}
.btn-google { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-google:hover { border-color: var(--ink-2); }
.btn-google svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--teal); color: var(--teal-ink); border: 1px solid var(--teal); }
.btn-primary:hover { filter: brightness(1.08); }

.or { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 22px 0; color: var(--ink-2); font-size: .88rem; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); }

label { display: block; font-weight: 500; font-size: .92rem; margin-bottom: 6px; }
input {
  width: 100%; padding: 12px 14px; margin-bottom: 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); font: inherit;
}
input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: transparent; }

.status { margin: 18px 0 0; padding: 12px 14px; border-radius: 10px; font-size: .9rem; border: 1px solid var(--warn); color: var(--ink); }
.status[hidden] { display: none; }
.status b { color: var(--warn); }
.fine { margin: 22px 0 0; font-size: .84rem; color: var(--ink-2); }
footer { padding-block: 20px; font-size: .85rem; color: var(--ink-2); text-align: center; }
@media (max-width: 480px) { .card { padding: 28px 20px 22px; } }
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="/" aria-label="SCALEGPT home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--teal)"/><path d="M9 21c2 2 5 2.5 7.5 2 3-.6 5-2.6 5-5.2 0-5.6-11-3.6-11-8.6C10.5 7 12.7 5.6 15.5 5.6c2 0 3.8.7 5 1.9" fill="none" stroke="var(--teal-ink)" stroke-width="2.6" stroke-linecap="round"/></svg>
    SCALEGPT
  </a>
  <a class="back" href="/">Back to overview</a>
</header>

<main>
  <div class="card">
    <h1>Sign in to SCALEGPT</h1>
    <p class="sub">Use your Google account or your work email.</p>

    <a class="btn btn-google" id="google" href="#" data-path="/oauth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </a>

    <div class="or">or</div>

    <form id="email-form" novalidate>
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
      <button class="btn btn-primary" type="submit">Continue with email</button>
    </form>

    <p class="status" id="status" role="status" hidden></p>

    <p class="fine">Access follows your role in SCALEGPT. You only see knowledge your account is allowed to read.</p>
  </div>
</main>

<footer>SCALEGPT, built on LibreChat.</footer>

<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('scalegpt-theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  var appUrl = (document.querySelector('meta[name="scalegpt-app-url"]').content || '').trim().replace(/\/+$/, '');
  var status = document.getElementById('status');
  var google = document.getElementById('google');
  var form = document.getElementById('email-form');
  var email = document.getElementById('email');

  function say(html) { status.innerHTML = html; status.hidden = false; }
  function notLive() {
    say('<b>Sign-in is not open yet.</b> The SCALEGPT app is still being deployed. Check back after Phase 1 goes live.');
  }

  if (appUrl) google.href = appUrl + google.getAttribute('data-path');

  google.addEventListener('click', function (e) {
    if (appUrl) return;
    e.preventDefault();
    notLive();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!email.checkValidity()) {
      say('<b>Enter a valid email address</b>, for example name@company.com.');
      email.focus();
      return;
    }
    if (!appUrl) { notLive(); return; }
    window.location.href = appUrl + '/login?email=' + encodeURIComponent(email.value.trim());
  });
})();
</script>
</body>
</html>
